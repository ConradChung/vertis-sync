name: Deploy Supabase edge functions

# Deploys from disk on every push to main that touches a function, so deployed == repo by construction.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a personal access token from supabase.com/dashboard/account/tokens).
# Without it the job passes with a warning and deploys nothing.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: rcfrumrbauwvyzfebxck

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Check for the Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping deploy. Add it under Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest
      - name: Deploy functions that verify their own callers without a JWT
        if: steps.gate.outputs.skip != 'true'
        run: supabase functions deploy telegram-inbox slack-inbox hnwi-pipeline-orchestrator --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy the remaining functions
        if: steps.gate.outputs.skip != 'true'
        run: supabase functions deploy instantly-rotate instantly-push email-validator contact-email-finder hnwi-email-finder operating-city-enricher pipeline-watchdog jobsearch-notify jobsearch-puller jobsearch-sheet-writer leadsfriday-order --project-ref "$PROJECT_REF"
